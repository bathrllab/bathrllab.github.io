<li class="media team-member-item">
  <img class="profile-avatar align-self-center"
       src="/assets/img/{{ member.profileImg }}"
       alt="{{ member.name }}">

  <div class="media-body">
    <h3 class="name">{{ member.name }}</h3>
    {% if include.is_alumni and member.alumniRole %}
      <p class="role">{{member.alumniRole}}</p>
    {% elsif member.role %}
      <p class="role">{{member.role}}</p>
    {% endif %}
    {%- include team_member_social.html -%}
  </div>
</li>
